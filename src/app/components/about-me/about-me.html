<section id="about-me" class="about-me">
  <div class="about-me__inner container">
    <div class="about-me__photo-wrapper">
      <img
        class="about-me__pattern"
        src="assets/images/about-me/preview-pattern-picture.svg"
        alt=""
      />
      <img
        class="about-me__photo"
        src="assets/images/about-me/portrait-placeholder.png"
        [alt]="'about.photoAlt' | translate"
        width="568"
        height="568"
      />
    </div>
    <div class="about-me__box">
      <p class="section-label">{{ 'about.label' | translate }}</p>
      <div class="about-me__card">
        <h2 class="section-title">{{ 'about.title' | translate }}</h2>
        <p class="about-me__text">{{ 'about.intro' | translate }}</p>
        <ul class="about-me__highlights">
          @for (highlight of highlights; track highlight.icon) {
            <li class="about-me__highlight">
              <img [src]="'assets/images/about-me/' + highlight.icon" alt="" />
              <p>{{ highlight.key | translate }}</p>
            </li>
          }
        </ul>
      </div>
    </div>
  </div>
</section>
