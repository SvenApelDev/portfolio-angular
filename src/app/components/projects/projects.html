<section id="projects" class="projects">
    <div class="container">
        <div class="projects__header">
            <p class="section-label">Portfolio</p>
            <h2 class="section-title">Featured Projects</h2>
        </div>

        <p class="projects__intro">Explore a selection of my work here - Interact with projects to see my skills in action.</p>

        <ul class="projects__list">
            @for (project of projects; track project.title) {
                <li>
                    <button class="projects__row" type="button">
                        <span class="projects__title">{{ project.title }}</span>
                        <span class="projects__tech">
                            @for (tech of project.technologies; track tech) {
                                <span>{{ tech }}</span>
                            }
                        </span>
                    </button>
                </li>
            }
        </ul>
    </div>
</section>
